spring:
  application:
    name: ApiGatewayService
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: restaurant-service
              uri: lb://RESTAURANTSERVICE
              predicates:
                - Path=/restaurants/**
      actuator:
        verbose:
          enabled: true
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.discovery: DEBUG
management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,info,gateway