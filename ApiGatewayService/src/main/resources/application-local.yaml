spring:
  application:
    name: ApiGatewayService

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
#      server:
#        webmvc:
#          routes:
#            - id: RESTAURANTSERVICE
#              uri: lb://RESTAURANTSERVICE
#              predicates:
